<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Blaster</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD */
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .hud-bottom {
            text-align: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 0; /* Remove padding to flush with bottom */
            pointer-events: none;
        }

        #question-display {
            font-size: 32px; /* Adjusted size for mobile */
            font-weight: 800;
            background: rgba(10, 10, 20, 0.9);
            padding: 15px 0;
            width: 100%;
            border-top: 2px solid #00ffff;
            border-bottom: none;
            border-left: none;
            border-right: none;
            border-radius: 0;
            box-shadow: 0 -4px 20px rgba(0, 255, 255, 0.2);
            display: block;
            margin: 0;
        }

        /* Menus */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 20, 0.95);
            display: flex; /* Flex is toggled in JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: auto;
        }

        h1 {
            font-size: 60px;
            margin: 0 0 20px 0;
            background: linear-gradient(to right, #00ffff, #ff00cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .option-group {
            margin: 15px 0;
            text-align: center;
        }

        .option-label {
            font-size: 20px;
            margin-bottom: 10px;
            color: #aaa;
            display: block;
        }

        .checkbox-group label {
            display: inline-block;
            margin: 0 10px;
            font-size: 24px;
            cursor: pointer;
            padding: 10px 20px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #444;
            transition: 0.2s;
        }

        .checkbox-group input:checked + span {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        .checkbox-group input {
            display: none;
        }

        .checkbox-group label:hover {
            background: #333;
        }

        input[type="number"] {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 18px;
            width: 80px;
            text-align: center;
        }

        button {
            background: linear-gradient(45deg, #ff00cc, #333399);
            border: none;
            padding: 15px 50px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 204, 0.5);
            margin-top: 30px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #game-over-screen {
            display: none;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-el">Score: 0</div>
            <div id="lives-el">Lives: 3</div>
        </div>
        <div class="hud-bottom">
            <div id="question-display">? + ?</div>
        </div>
    </div>

    <!-- START MENU -->
    <div id="start-menu" class="menu-screen">
        <h1>MATH BLASTER</h1>
        
        <div class="option-group">
            <span class="option-label">Operations</span>
            <div class="checkbox-group">
                <label><input type="checkbox" id="op-add" checked> <span>+</span></label>
                <label><input type="checkbox" id="op-sub" checked> <span>-</span></label>
                <label><input type="checkbox" id="op-mul"> <span>×</span></label>
                <label><input type="checkbox" id="op-div"> <span>÷</span></label>
            </div>
        </div>

        <div class="option-group">
            <span class="option-label">Difficulty (Max Number)</span>
            <input type="number" id="max-num" value="10" min="5" max="100">
        </div>

        <button onclick="startGame()">START MISSION</button>
    </div>

    <!-- GAME OVER MENU -->
    <div id="game-over-screen" class="menu-screen">
        <h1>GAME OVER</h1>
        <div class="option-group">
            <span class="option-label">Final Score</span>
            <div id="final-score" style="font-size: 40px; color: #00ffff;">0</div>
        </div>
        <button onclick="resetToMenu()">MENU</button>
    </div>
</div>

<script>
    /** GAME ENGINE & LOGIC **/
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startMenu = document.getElementById('start-menu');
    const gameOverScreen = document.getElementById('game-over-screen');
    const questionDisplay = document.getElementById('question-display');
    const scoreEl = document.getElementById('score-el');
    const livesEl = document.getElementById('lives-el');
    const finalScoreEl = document.getElementById('final-score');
    const uiLayer = document.getElementById('ui-layer');

    // Game State
    let gameState = 'menu'; // menu, playing, gameover
    let score = 0;
    let lives = 3;
    let difficultyMultiplier = 1;
    let maxNumber = 10;
    let selectedOps = [];
    
    // Current Question
    let currentQuestion = {
        text: "",
        answer: 0
    };

    // Entities
    let bullets = [];
    let targets = [];
    let particles = [];
    let player = {
        x: 0,
        y: 0,
        angle: -Math.PI / 2,
        color: '#00ff00'
    };
    
    let mouse = { x: 0, y: 0 };

    // Resize Handling
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Move player to middle bottom, sitting just above the question bar (approx 80px height)
        // 80px (bar) + 30px (radius) + 10px (margin)
        player.y = canvas.height - 120;
        player.x = canvas.width / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Mouse Tracking
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });
    
    // Shoot on Click
    window.addEventListener('mousedown', (e) => {
        if (gameState === 'playing') {
            shoot();
        }
    });
    
    // Touch support
    window.addEventListener('touchstart', (e) => {
        if (gameState === 'playing') {
            e.preventDefault(); // Prevent scrolling on mobile
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            shoot();
        }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
        if (gameState === 'playing') {
            e.preventDefault(); // Prevent scrolling on mobile
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }
    }, { passive: false });

    /** MATH LOGIC **/
    function generateQuestion() {
        if (selectedOps.length === 0) selectedOps = ['+']; // Fallback
        
        const op = selectedOps[Math.floor(Math.random() * selectedOps.length)];
        let a, b, ans, text;

        // Logic to ensure nice numbers (integers, no negatives if sub)
        switch(op) {
            case '+':
                a = Math.floor(Math.random() * maxNumber) + 1;
                b = Math.floor(Math.random() * maxNumber) + 1;
                ans = a + b;
                text = `${a} + ${b}`;
                break;
            case '-':
                a = Math.floor(Math.random() * maxNumber) + 1;
                b = Math.floor(Math.random() * a); // Ensure result is positive
                ans = a - b;
                text = `${a} - ${b}`;
                break;
            case '*':
                a = Math.floor(Math.random() * (maxNumber/2)) + 1; // Smaller numbers for mul
                b = Math.floor(Math.random() * 10) + 1;
                ans = a * b;
                text = `${a} × ${b}`;
                break;
            case '/':
                b = Math.floor(Math.random() * 9) + 2; // Divisor
                ans = Math.floor(Math.random() * (maxNumber/2)) + 1; // Answer
                a = b * ans; // Dividend
                text = `${a} ÷ ${b}`;
                break;
        }

        currentQuestion = { text: text + " = ?", answer: ans };
        questionDisplay.textContent = currentQuestion.text;
        
        spawnTargets(ans);
    }

    function spawnTargets(correctAnswer) {
        targets = [];
        const numTargets = 4; // Number of falling options
        const laneWidth = canvas.width / numTargets;
        
        // Decide which lane has the correct answer
        const correctLane = Math.floor(Math.random() * numTargets);

        for (let i = 0; i < numTargets; i++) {
            let val;
            let isCorrect = (i === correctLane);

            if (isCorrect) {
                val = correctAnswer;
            } else {
                // Generate distractor
                do {
                    let offset = Math.floor(Math.random() * 10) - 5;
                    if (offset === 0) offset = 1;
                    val = correctAnswer + offset;
                    // Prevent negative wrong answers
                    if (val < 0) val = Math.abs(val) + 1; 
                } while (val === correctAnswer || targets.some(t => t.value === val));
            }

            targets.push({
                x: (i * laneWidth) + (laneWidth / 2),
                y: -50 - (Math.random() * 100), // Stagger start heights
                radius: 35,
                value: val,
                isCorrect: isCorrect,
                // Slower speed: 0.5 base instead of 1, and slower ramp up
                speed: (0.5 + (difficultyMultiplier * 0.3)) + (Math.random() * 0.3), 
                color: isCorrect ? '#ffffff' : '#dddddd' // Hidden initially
            });
        }
    }

    /** GAME LOOP LOGIC **/
    function startGame() {
        // Get Settings
        selectedOps = [];
        if(document.getElementById('op-add').checked) selectedOps.push('+');
        if(document.getElementById('op-sub').checked) selectedOps.push('-');
        if(document.getElementById('op-mul').checked) selectedOps.push('*');
        if(document.getElementById('op-div').checked) selectedOps.push('/');
        
        if (selectedOps.length === 0) {
            alert("Please select at least one operation!");
            return;
        }

        maxNumber = parseInt(document.getElementById('max-num').value) || 10;
        
        // Reset State
        score = 0;
        lives = 3;
        difficultyMultiplier = 0;
        bullets = [];
        targets = [];
        particles = [];
        
        scoreEl.textContent = "Score: " + score;
        livesEl.textContent = "Lives: " + lives;
        
        startMenu.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        uiLayer.classList.remove('hidden');
        
        gameState = 'playing';
        generateQuestion();
        
        gameLoop();
    }

    function resetToMenu() {
        gameState = 'menu';
        startMenu.classList.remove('hidden');
        gameOverScreen.classList.add('hidden');
    }

    function loseLife() {
        lives--;
        livesEl.textContent = "Lives: " + lives;
        
        // Shake effect
        canvas.style.transform = "translate(5px, 5px)";
        setTimeout(() => canvas.style.transform = "none", 50);

        if (lives <= 0) {
            gameState = 'gameover';
            finalScoreEl.textContent = score;
            gameOverScreen.style.display = 'flex'; // Fix for flex override
            gameOverScreen.classList.remove('hidden');
        } else {
            // Clear screen and new question
            createExplosion(canvas.width/2, canvas.height/2, '#ff0000');
            generateQuestion();
        }
    }

    function shoot() {
        const dx = mouse.x - player.x;
        const dy = mouse.y - player.y;
        const angle = Math.atan2(dy, dx);
        
        bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 15,
            vy: Math.sin(angle) * 15,
            radius: 5
        });
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: color
            });
        }
    }

    function update() {
        // Difficulty scaling
        difficultyMultiplier = Math.min(5, score / 5); // Max out speed increase eventually

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Out of bounds
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(i, 1);
                continue;
            }

            // Collision with Targets
            let hit = false;
            for (let j = targets.length - 1; j >= 0; j--) {
                let t = targets[j];
                let dist = Math.hypot(b.x - t.x, b.y - t.y);
                
                if (dist < t.radius + b.radius) {
                    // HIT!
                    createExplosion(t.x, t.y, t.isCorrect ? '#00ff00' : '#ff0000');
                    
                    if (t.isCorrect) {
                        score++;
                        scoreEl.textContent = "Score: " + score;
                        bullets.splice(i, 1);
                        targets = []; // Clear all
                        generateQuestion(); // Next level
                    } else {
                        // Hit wrong target
                        loseLife();
                        bullets.splice(i, 1);
                    }
                    hit = true;
                    break;
                }
            }
            if (hit) break;
        }

        // Update Targets
        let correctTargetAlive = false;
        for (let i = targets.length - 1; i >= 0; i--) {
            let t = targets[i];
            t.y += t.speed;
            
            if (t.isCorrect) correctTargetAlive = true;

            // Hit floor
            if (t.y > canvas.height + 50) {
                if (t.isCorrect) {
                    loseLife(); // Missed the right answer
                }
                targets.splice(i, 1);
            }
        }
        
        // Fail-safe: If correct answer destroyed by edge case or out of bounds, regenerate
        if (targets.length === 0 && gameState === 'playing') {
             // This happens if all targets fall off without interaction (rare due to correct logic above)
             generateQuestion();
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        // Clear
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid (Aesthetic)
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        const offset = (Date.now() / 50) % gridSize;
        
        for (let x = 0; x < canvas.width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = offset; y < canvas.height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Draw Player Turret
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(angle);
        
        // Turret Body
        ctx.fillStyle = '#444';
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.fill();
        
        // Turret Barrel
        ctx.fillStyle = '#00ffff';
        ctx.fillRect(0, -10, 50, 20);
        ctx.restore();

        // Draw Bullets
        ctx.fillStyle = '#ffff00';
        for (let b of bullets) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Targets
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 24px Arial';
        
        for (let t of targets) {
            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = t.isCorrect ? 'rgba(0,255,0,0.5)' : 'rgba(255,0,255,0.5)'; // Slight cheat: subtle glow hint (optional, kept same for now)
            ctx.shadowColor = 'rgba(0, 255, 255, 0.5)'; // Generic glow to prevent cheating

            // Box/Circle
            ctx.fillStyle = '#222';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();
            
            ctx.shadowBlur = 0; // Reset glow for text

            // Number
            ctx.fillStyle = '#ffffff';
            ctx.fillText(t.value, t.x, t.y);
        }

        // Draw Particles
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function gameLoop() {
        if (gameState === 'playing') {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        } else if (gameState === 'gameover') {
            draw(); // Keep last frame
        }
    }
</script>
</body>
</html>
